name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Nuxt 4.6 wants Node 22.22+ or 24.15+
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # the preset Workers Builds deploys with; the database id only fills in wrangler.json
      - run: bun run build
        env:
          NITRO_PRESET: cloudflare_module
          NUXT_D1_DATABASE_ID: ci
